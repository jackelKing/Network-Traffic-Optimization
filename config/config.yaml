simulation:
  num_nodes: 4
  sim_time: 10.0
  port: 5555
  step_interval: 0.5

topology:
  type: linear
  data_rate: "10Mbps"
  delay: "2ms"

ppo:
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  total_timesteps: 50000

reward:
  delay_weight: 0.5
  throughput_weight: 0.3
  loss_weight: 0.2
