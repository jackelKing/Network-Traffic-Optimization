simulation:
  num_nodes: 4
  sim_time: 10.0
  port: 5555
  step_interval: 0.5

topology:
  type: linear
  data_rate: "10Mbps"
  delay: "2ms"

ppo:
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 512
  batch_size: 128
  n_epochs: 15
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.05
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 150000

network:
  net_arch: [256, 256, 128]

reward:
  delay_weight: 0.3
  throughput_weight: 0.6
  loss_weight: 0.1
  progress_bonus: 0.1
  shaping: true
